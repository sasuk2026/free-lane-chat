# Render Blueprint — 免费模型 OpenAI 兼容网关
# 用法：把本仓库连接到 Render，选择「Blueprint」即可一键部署。
# 部署完成后获得永久不变的 https://<service>.onrender.com/v1 地址（免费套餐有冷启动）。
services:
  - type: web
    name: free-lane-chat
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: "npm install"
    startCommand: "node server.js"
    # 健康检查：GET /v1/models 正常返回 200 才算存活
    healthCheckPath: "/v1/models"
    # Render 会在运行时注入 PORT 环境变量，server.js 已支持
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: API_KEY
        value: "sk-free-lane"
